<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#111827;--mut:#6b7280;--line:#e5e7eb;--hd:#0f172a;--acc:#15803d;--live:#dc2626;--saf:#f97316;--lnk:#1d4ed8}
:root[data-theme=dark]{--bg:#0b0f17;--card:#121826;--ink:#e5e7eb;--mut:#9ca3af;--line:#1f2937;--hd:#05080d;--acc:#4ade80;--live:#f87171;--saf:#fb923c;--lnk:#7aa2ff}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 "Inter","Noto Sans Devanagari",system-ui,sans-serif;background-color:var(--bg);background-image:var(--wp);background-size:cover;background-attachment:fixed;background-position:center;color:var(--ink);-webkit-font-smoothing:antialiased}
.w{max-width:1040px;margin:0 auto;padding:0 16px}
.hd{background:var(--hd);color:#fff;position:relative}
.hd::before{content:"";display:block;height:3px;background:linear-gradient(90deg,#ff9933 33.3%,#fff 33.3% 66.6%,#138808 66.6%)}
.hd .w{display:flex;align-items:center;justify-content:space-between;height:54px}
.lg{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.35rem;letter-spacing:-.4px}
.lg small{font-size:.6rem;letter-spacing:.16em;background:var(--saf);color:#111;font-weight:800;padding:2px 6px;border-radius:4px;margin-left:-2px}
.tools{display:flex;gap:6px}
.tools button{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:6px;padding:4px 11px;font:inherit;font-size:.85rem;font-weight:600;cursor:pointer}
.tb{background:var(--hd);position:sticky;top:0;z-index:5;border-bottom:1px solid rgba(255,255,255,.08)}
#tabs{display:flex;overflow-x:auto;scrollbar-width:none}
#tabs button{background:none;border:0;border-bottom:3px solid transparent;color:#9ca9bd;padding:10px 16px 8px;font:inherit;font-weight:600;font-size:.92rem;cursor:pointer;white-space:nowrap}
#tabs button.on{color:#fff;border-bottom-color:var(--acc)}
#tabs span{color:#7b8aa3;font-weight:500;margin-left:5px}
.strip{display:flex;gap:10px;overflow-x:auto;padding:14px 16px;max-width:1040px;margin:0 auto;scrollbar-width:thin}
.mini{flex:0 0 196px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font:inherit;color:var(--ink);cursor:pointer}
.mini.in{box-shadow:inset 3px 0 0 var(--saf)}
.mt{font-size:.68rem;font-weight:600;letter-spacing:.04em;color:var(--mut);margin-bottom:3px}
.mr{display:flex;justify-content:space-between;font-weight:600;font-size:.88rem}
.mr span:last-child,.sc{font-variant-numeric:tabular-nums}
.ms{font-size:.72rem;color:var(--mut);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--live);margin-right:5px;animation:pl 1.4s infinite}
@keyframes pl{50%{opacity:.25}}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:4px 0 10px}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;color:var(--ink);padding:6px 14px;font:inherit;font-size:.85rem;font-weight:600;cursor:pointer}
.seg button.on{background:var(--hd);color:#fff}
:root[data-theme=dark] .seg button.on{background:var(--acc);color:#05080d}
select{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:7px;padding:6px 10px;max-width:50%}
#meta{display:inline-block;font-size:.78rem;color:var(--mut);background:var(--card);border-radius:99px;padding:1px 11px;margin:0 0 10px}#meta:empty{display:none}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:30px}
.row{padding:14px 16px;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.row.in{box-shadow:inset 3px 0 0 var(--saf)}
.ttl{font-weight:600;font-size:.95rem}
.vn{font-size:.78rem;color:var(--mut);margin-top:1px}
.rb{display:grid;gap:10px;margin-top:10px}
@media(min-width:700px){.rb{grid-template-columns:1.3fr 1fr;align-items:center}}
.tm{display:flex;align-items:center;gap:10px;padding:3px 0}
.bd{position:relative;flex:0 0 26px;width:26px;height:26px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:.6rem;font-weight:700;overflow:hidden;color:var(--mut)}
.bd img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--card)}
.nm{flex:1;font-weight:500}
.sc{font-weight:700;font-size:1rem}
.st{font-size:.86rem;font-weight:600;line-height:1.35}
.st.live{color:var(--live)}.st.done{color:var(--acc)}.st.up{color:var(--mut)}
.act{display:flex;gap:8px;margin-top:8px}
.act button,.act a,.lk{font:inherit;font-size:.8rem;font-weight:600;border:1px solid var(--line);background:none;color:var(--ink);border-radius:6px;padding:4px 11px;cursor:pointer;text-decoration:none}
.act button:hover,.act a:hover{border-color:var(--ink)}
.tag{font-size:.65rem;font-weight:700;letter-spacing:.06em;background:var(--saf);color:#111;border-radius:4px;padding:1px 6px;margin-right:6px;vertical-align:1px}
.live{color:var(--live);font-weight:700;font-size:.72rem;letter-spacing:.05em;margin-right:6px}
.nw a{color:var(--ink);font-weight:600;text-decoration:none}.nw a:hover{color:var(--lnk)}
.nw p{margin:4px 0 0;color:var(--mut);font-size:.88rem}
.msg{text-align:center;color:var(--mut);padding:40px 10px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.sk{height:84px;margin:12px 16px;border-radius:8px;background:linear-gradient(90deg,var(--card),var(--line),var(--card));background-size:200% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
dialog{width:min(720px,96vw);max-height:88vh;border:0;border-radius:12px;padding:0;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--hd);color:#fff;position:sticky;top:0}
.dh h2{margin:0;font-size:1rem;font-weight:600}.dh button{border:0;background:none;color:#fff;font-size:1.5rem;cursor:pointer}
.db{padding:4px 16px 16px}
.wx{font-size:.85rem;color:var(--mut);padding:10px 0 4px}
.db h3{font-size:.95rem;margin:16px 0 4px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:right;padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
th{color:var(--mut);font-weight:600;font-size:.75rem;background:var(--bg)}
td small{display:block;color:var(--mut);font-size:.74rem}
.pn{background:none;border:0;padding:0;font:inherit;font-weight:600;color:var(--lnk);cursor:pointer;text-align:left}
.pn:hover{text-decoration:underline}
.ph{float:right;width:96px;height:auto;border-radius:8px;margin:0 0 8px 12px}
.db p{margin:8px 0}.db a{color:var(--lnk)}
.note{font-size:.75rem;color:var(--mut)}
.ins{font-size:.78rem;color:var(--mut);margin-top:5px;font-variant-numeric:tabular-nums}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.fg label{font-size:.78rem;color:var(--mut);font-weight:600}
.fg input{display:block;width:100%;margin-top:3px;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink)}
.res{margin-top:10px;font-weight:700;color:var(--acc);min-height:1.4em}
.opt{display:block;width:100%;text-align:left;margin-top:8px;font:inherit;font-weight:600;padding:11px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer}
.opt.ok{border-color:var(--acc);background:rgba(21,128,61,.12)}.opt.bad{border-color:var(--live);background:rgba(220,38,38,.1)}
.pr{font-size:.78rem;color:var(--mut);font-weight:600}
.big{font-size:2.2rem;font-weight:800;margin:6px 0}
.btn{font:inherit;font-weight:700;background:var(--hd);color:#fff;border:0;border-radius:8px;padding:9px 18px;cursor:pointer;margin:12px 8px 0 0;text-decoration:none;display:inline-block}
:root[data-theme=dark] .btn{background:var(--acc);color:#05080d}
.sp{position:fixed;inset:0;z-index:100;background:linear-gradient(#0a1020,#16305f);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transition:opacity .5s;color:#fff;text-align:center}
.sp.out{opacity:0;pointer-events:none}
.sp-stage{position:relative;width:min(560px,94vw);animation:sp-shake 5.6s forwards}
.sp-stage svg{width:100%;height:auto;display:block}
@keyframes sp-shake{0%,45%{transform:none}47%{transform:translateX(-4px)}49%{transform:translateX(3px)}51%{transform:translateX(-2px)}53%,100%{transform:none}}
.sp-six{position:absolute;top:2%;left:50%;transform:translateX(-50%);opacity:0;animation:sp-pop 5.6s forwards;pointer-events:none;white-space:nowrap}
.sp-six b{display:block;font-size:clamp(2.2rem,10vw,3.6rem);font-weight:800;line-height:1.1;color:#ff6b5e;text-shadow:0 3px 0 #7f1d1d,0 0 24px rgba(255,90,70,.55)}
.sp-six span{font-size:1.05rem;font-weight:800;letter-spacing:.35em;color:#fff}
@keyframes sp-pop{0%,49%{opacity:0;transform:translateX(-50%) scale(.3)}56%{opacity:1;transform:translateX(-50%) scale(1.2)}62%,100%{opacity:1;transform:translateX(-50%) scale(1)}}
.sp-man{transform-origin:109px 186px;animation:sp-slump 5.6s forwards}
@keyframes sp-slump{0%,48%{transform:none}60%,100%{transform:translate(-1px,2px) rotate(-4deg)}}
.sp-bat{transform-origin:126px 118px;animation:sp-swing 5.6s forwards}
@keyframes sp-swing{0%{transform:rotate(108deg);animation-timing-function:ease-in-out}12%{transform:rotate(113deg);animation-timing-function:ease-in-out}24%{transform:rotate(108deg);animation-timing-function:ease-in-out}34%{transform:rotate(122deg)}40%{transform:rotate(122deg);animation-timing-function:cubic-bezier(.45,0,.55,1)}47%{transform:rotate(-30deg);animation-timing-function:cubic-bezier(.2,.6,.4,1)}62%,100%{transform:rotate(-100deg)}}
.sp-ball{animation:sp-ball 5.6s forwards}
@keyframes sp-ball{0%{transform:translate(372px,56px);animation-timing-function:cubic-bezier(.5,0,.9,.6)}20%{transform:translate(250px,180px);animation-timing-function:cubic-bezier(.2,.5,.5,1)}31%{transform:translate(195px,160px);animation-timing-function:cubic-bezier(.5,0,.8,.5)}41%{transform:translate(110px,176px);animation-timing-function:linear}46%{transform:translate(66px,170px);animation-timing-function:ease-out}56%{transform:translate(16px,182px);opacity:1}66%,100%{transform:translate(-8px,182px);opacity:0}}
.sp-st1{transform-box:view-box;transform-origin:44px 186px;animation:sp-s1 5.6s forwards}
.sp-st3{transform-box:view-box;transform-origin:60px 186px;animation:sp-s3 5.6s forwards}
.sp-st2,.sp-b1,.sp-b2,.sp-burst{transform-box:fill-box;transform-origin:center}
.sp-st2{animation:sp-s2 5.6s forwards}.sp-b1{animation:sp-bl 5.6s forwards}.sp-b2{animation:sp-br 5.6s forwards}
@keyframes sp-s1{0%,46%{transform:none;animation-timing-function:ease-in}72%,100%{transform:rotate(-84deg)}}
@keyframes sp-s3{0%,46%{transform:none;animation-timing-function:ease-in}70%,100%{transform:rotate(-70deg)}}
@keyframes sp-s2{0%,46%{transform:none;animation-timing-function:cubic-bezier(.3,.6,.5,1)}58%{transform:translate(-22px,-36px) rotate(-250deg);animation-timing-function:cubic-bezier(.5,0,.8,.6)}72%,100%{transform:translate(-40px,20px) rotate(-450deg)}}
@keyframes sp-bl{0%,46%{transform:none;animation-timing-function:cubic-bezier(.3,.6,.5,1)}57%{transform:translate(-14px,-48px) rotate(-190deg);animation-timing-function:cubic-bezier(.5,0,.8,.6)}74%,100%{transform:translate(-30px,48px) rotate(-420deg)}}
@keyframes sp-br{0%,46%{transform:none;animation-timing-function:cubic-bezier(.3,.6,.5,1)}58%{transform:translate(10px,-58px) rotate(220deg);animation-timing-function:cubic-bezier(.5,0,.8,.6)}76%,100%{transform:translate(14px,48px) rotate(480deg)}}
.sp-burst{opacity:0;animation:sp-bu 5.6s forwards}
@keyframes sp-bu{0%,45.5%{opacity:0;transform:scale(.2)}47%{opacity:.9;transform:scale(1)}56%,100%{opacity:0;transform:scale(4)}}
.sp-crowd{animation:sp-wave 1.2s ease-in-out infinite alternate}
@keyframes sp-wave{to{opacity:.35}}
.sp-ld{font-weight:700;font-size:1.05rem}.sp-ld b{background:#f97316;color:#111;border-radius:4px;padding:0 6px;font-size:.7rem;letter-spacing:.15em;margin-left:4px;vertical-align:2px}
.sp-ld span{display:block;font-weight:400;font-size:.8rem;opacity:.75;margin-top:2px}
.sp-bar{width:min(260px,70vw);height:4px;border-radius:4px;background:rgba(255,255,255,.18);overflow:hidden}
.sp-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff9933,#fff,#138808);animation:sp-fill 5.8s linear forwards}
@keyframes sp-fill{to{width:100%}}
.sp-snd{font:inherit;font-weight:600;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:8px 18px;cursor:pointer}
.sp small{opacity:.55;font-size:.72rem}
@media(prefers-reduced-motion:reduce){.sp-stage,.sp-man,.sp-crowd,.sp-burst{animation:none}.sp-six{animation:none;opacity:1}.sp-bat{animation:none;transform:rotate(-100deg)}.sp-ball{animation:none;opacity:0}.sp-st1{animation:none;transform:rotate(-84deg)}.sp-st3{animation:none;transform:rotate(-70deg)}.sp-st2{animation:none;transform:translate(-40px,20px) rotate(-450deg)}.sp-b1{animation:none;transform:translate(-30px,48px) rotate(-420deg)}.sp-b2{animation:none;transform:translate(14px,48px) rotate(480deg)}}
:root{--wp:none}
:root[data-wp=stadium]{--wp:radial-gradient(520px 260px at 12% -4%,rgba(255,226,160,.6),transparent 65%),radial-gradient(520px 260px at 88% -4%,rgba(255,226,160,.55),transparent 65%),linear-gradient(#c9dcfa,#e6effc 58%,#c6e6cf)}
:root[data-theme=dark][data-wp=stadium]{--wp:radial-gradient(520px 260px at 12% -4%,rgba(255,214,140,.3),transparent 65%),radial-gradient(520px 260px at 88% -4%,rgba(255,214,140,.27),transparent 65%),linear-gradient(#0d1b3a,#0a1224 58%,#0a2a1b)}
:root[data-wp=pitch]{--wp:repeating-linear-gradient(90deg,rgba(255,255,255,.14) 0 70px,rgba(255,255,255,0) 70px 140px),linear-gradient(#b4dcae,#98cd92)}
:root[data-theme=dark][data-wp=pitch]{--wp:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 70px,rgba(255,255,255,0) 70px 140px),linear-gradient(#154127,#0e2c1c)}
:root[data-wp=tricolor]{--wp:linear-gradient(165deg,#ffe3c2 0 34%,#fff 34% 66%,#d3eed7 66%)}
:root[data-theme=dark][data-wp=tricolor]{--wp:linear-gradient(165deg,#3b2410 0 34%,#141b2b 34% 66%,#10301a 66%)}
:root[data-wp=photo]{--wp:linear-gradient(rgba(10,18,36,.55),rgba(10,18,36,.68)),url(/wallpaper.jpg),linear-gradient(#0d1b3a,#0a2a1b)}
:root[data-wp=plain]{--wp:none}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--hd);color:#fff;padding:8px 16px;border-radius:99px;font-size:.85rem;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50}
#toast.on{opacity:1}
.ft{padding:0 16px 40px;font-size:.8rem;color:var(--mut)}.ft div{background:var(--card);border-radius:10px;padding:10px 14px;line-height:1.7}.ft a{color:var(--mut)}
button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--lnk);outline-offset:2px}
@media(prefers-reduced-motion:reduce){.sk,.dot{animation:none}}
</style>
</head>

<script>
const L={en:{news:"News",nonews:"News is not available right now.",live:"Live",up:"Upcoming",done:"Recent",ind:"Team India",all:"All matches",none:"My team: none",empty:"No matches in this section right now.",upd:"Updated",ago:"min ago",now:"just now",sc:"Scorecard",wa:"Share",bat:"Batting",bowl:"Bowling",nosc:"Scorecard is not available for this match yet.",err:"Could not load scores. Please try again in a few minutes.",lv:"LIVE",tI:"INDIA",wind:"wind",wiki:"Read more on Wikipedia",nop:"Player details not found.",wnote:"Source: Wikipedia. The match may not always be exact."},
hi:{news:"खबरें",nonews:"अभी खबरें उपलब्ध नहीं हैं।",live:"लाइव",up:"आने वाले",done:"हाल के",ind:"टीम इंडिया",all:"सभी मैच",none:"मेरी टीम: कोई नहीं",empty:"अभी इस सेक्शन में कोई मैच नहीं है।",upd:"अपडेट",ago:"मिनट पहले",now:"अभी",sc:"स्कोरकार्ड",wa:"शेयर",bat:"बल्लेबाज़ी",bowl:"गेंदबाज़ी",nosc:"इस मैच का स्कोरकार्ड अभी उपलब्ध नहीं है।",err:"स्कोर लोड नहीं हो पाया। कुछ मिनट बाद फिर कोशिश करें।",lv:"लाइव",tI:"इंडिया",wind:"हवा",wiki:"विकिपीडिया पर पढ़ें",nop:"खिलाड़ी की जानकारी नहीं मिली।",wnote:"स्रोत: विकिपीडिया। हो सकता है नाम पूरी तरह न मिले।"}};
Object.assign(L.en,{quiz:"Quiz",tools:"Tools",proj:"Projected",need:"Need",inn:"in",balls:"balls",qh:"Daily Cricket Quiz",qs:"Question",next:"Next",fin:"Your score",again:"Play again",shq:"Share score",come:"New questions every day.",rrr:"Required run rate",tg:"Target",rs:"Runs scored",to:"Total overs",ob:"Overs bowled (e.g. 12.3)",sr:"Strike rate",ec:"Economy rate",rn:"Runs",bl:"Balls",rc:"Runs conceded",ov:"Overs"});
Object.assign(L.hi,{quiz:"क्विज़",tools:"टूल्स",proj:"अनुमानित",need:"चाहिए",inn:"में",balls:"गेंद",qh:"रोज़ का क्रिकेट क्विज़",qs:"सवाल",next:"अगला",fin:"आपका स्कोर",again:"फिर खेलें",shq:"स्कोर शेयर करें",come:"हर दिन नए सवाल।",rrr:"आवश्यक रन रेट",tg:"लक्ष्य",rs:"बने रन",to:"कुल ओवर",ob:"फेंके गए ओवर (जैसे 12.3)",sr:"स्ट्राइक रेट",ec:"इकॉनमी रेट",rn:"रन",bl:"गेंद",rc:"दिए गए रन",ov:"ओवर"});
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const get=(k,d)=>{try{return localStorage.getItem(k)??d}catch(e){return d}};
const put=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let S={lang:get("lang","en"),theme:get("theme",matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"),tab:"live",wp:get("wp","stadium"),india:get("india","0")==="1",fav:get("fav",""),matches:[],news:null,at:0,err:""};
const t=k=>L[S.lang][k];
const kind=m=>m.matchEnded?"done":m.matchStarted?"live":"up";
const isInd=m=>(m.teams||[]).some(x=>/india/i.test(x));
const score=(m,tm)=>((m.score||[]).filter(s=>(s.inning||"").toLowerCase().includes(tm.toLowerCase())).map(s=>`${s.r}/${s.w} (${s.o})`).join(" & "))||"-";
function badge(m,n){
 const i=(m.teamInfo||[]).find(x=>x.name===n)||{};
 const sn=(i.shortname||n.split(/\s+/).map(w=>w[0]).join("")).slice(0,4).toUpperCase();
 return{sn,html:`<span class="bd">${esc(sn.slice(0,3))}${i.img?`<img src="${esc(i.img)}" alt="" loading="lazy" onerror="this.remove()">`:""}</span>`};
}
const dat=m=>`data-id="${esc(m.id)}" data-n="${esc((m.teams||[]).join(" vs "))}" data-v="${esc(m.venue)}"`;
function shell(){
 document.documentElement.lang=S.lang;
 $("fIn").textContent=t("ind");$("fIn").classList.toggle("on",S.india);
 $("fAll").textContent=t("all");$("fAll").classList.toggle("on",!S.india);
 const teams=[...new Set(S.matches.flatMap(m=>m.teams||[]))].sort();
 $("fav").innerHTML=`<option value="">${esc(t("none"))}</option>`+teams.map(x=>`<option ${x===S.fav?"selected":""}>${esc(x)}</option>`).join("");
 $("lang").textContent=S.lang==="en"?"हिं":"EN";
}
function strip(){
 const o={live:0,done:1,up:2};
 const a=[...S.matches].sort((x,y)=>o[kind(x)]-o[kind(y)]||(isInd(y)-isInd(x))).slice(0,12);
 $("strip").innerHTML=a.map(m=>`<button class="mini ${isInd(m)?"in":""}" ${dat(m)}><div class="mt">${kind(m)==="live"?`<span class="dot"></span>${t("lv")}`:esc(m.matchType).toUpperCase()}</div>${(m.teams||[]).map(x=>`<div class="mr"><span>${esc(badge(m,x).sn)}</span><span>${esc(score(m,x))}</span></div>`).join("")}<div class="ms">${esc(m.status)}</div></button>`).join("");
}
function render(){
 shell();strip();
 const pool=S.india?S.matches.filter(isInd):S.matches;
 const cnt={live:0,up:0,done:0};pool.forEach(m=>cnt[kind(m)]++);
 $("tabs").innerHTML=["live","up","done","news","quiz","tools"].map(k=>`<button data-t="${k}" class="${S.tab===k?"on":""}">${t(k)}${cnt[k]===undefined?"":`<span>${cnt[k]}</span>`}</button>`).join("");
 const ex=["news","quiz","tools"].includes(S.tab);$("bar").hidden=ex;
 if(ex){$("meta").textContent="";return S.tab==="news"?renderNews():S.tab==="quiz"?renderQuiz():renderTools()}
 let items=pool.filter(m=>kind(m)===S.tab);
 const w=m=>(S.fav&&(m.teams||[]).includes(S.fav)?2:0)+(isInd(m)?1:0);
 items=items.map((m,i)=>[m,i]).sort((a,b)=>w(b[0])-w(a[0])||a[1]-b[1]).map(x=>x[0]);
 const mins=S.at?Math.floor((Date.now()-S.at)/60000):null;
 $("meta").textContent=S.err||(mins===null?"":`${t("upd")}: ${mins<1?t("now"):mins+" "+t("ago")}`);
 const sk='<div class="panel"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>';
 if(!S.matches.length&&!S.err){$("list").innerHTML=sk;return}
 if(S.err&&!S.matches.length){$("list").innerHTML=`<div class="msg">${esc(t("err"))}</div>`;return}
 if(!items.length){$("list").innerHTML=`<div class="msg">${esc(t("empty"))}</div>`;return}
 $("list").innerHTML='<div class="panel">'+items.map(m=>{const k=kind(m);return`<div class="row ${isInd(m)?"in":""}">
 <div class="ttl">${isInd(m)?`<span class="tag">${t("tI")}</span>`:""}${k==="live"?`<span class="live"><span class="dot"></span>${t("lv")}</span>`:""}${esc(m.name||(m.teams||[]).join(" vs "))}</div>
 <div class="vn">${esc(m.matchType).toUpperCase()} • ${esc(m.venue)}${k==="live"?"":" • "+esc(m.date)}</div>
 <div class="rb"><div>${(m.teams||[]).map(x=>`<div class="tm">${badge(m,x).html}<span class="nm">${esc(x)}</span><span class="sc">${esc(score(m,x))}</span></div>`).join("")}</div>
 <div><div class="st ${k}">${esc(m.status)}</div>${k==="live"?ins(m):""}<div class="act"><button ${dat(m)}>${t("sc")}</button><a target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent("🏏 "+(m.teams||[]).join(" vs ")+"\n"+(m.status||"")+"\n"+location.origin+"/match/"+m.id)}">${t("wa")}</a></div></div></div></div>`}).join("")+'</div>';
}
function renderNews(){
 if(S.news===null){$("list").innerHTML='<div class="panel"><div class="sk"></div><div class="sk"></div></div>';return}
 if(!S.news.length){$("list").innerHTML=`<div class="msg">${esc(t("nonews"))}</div>`;return}
 $("list").innerHTML='<div class="panel">'+S.news.map(n=>`<div class="row nw"><a href="${esc(n.link)}" target="_blank" rel="noopener">${esc(n.title)}</a><p>${esc((n.description||"").slice(0,160))}</p><div class="vn">${esc(n.source)} • ${esc((n.pubDate||"").slice(0,10))}</div></div>`).join("")+'</div>';
}
function ins(m){
 const mt=(m.matchType||"").toLowerCase(),max=mt==="t20"?20:mt==="odi"?50:0;if(!max)return"";
 const sc=m.score||[];let k=-1;sc.forEach((x,i)=>{if(+x.o>0&&+x.o<max&&+x.w<10)k=i});if(k<0)return"";
 const s=sc[k],o=+s.o,ov=Math.floor(o)+Math.round((o%1)*10)/6,rr=s.r/ov;
 let h=`CRR ${rr.toFixed(2)}`;
 if(k===0)h+=` • ${t("proj")} ${Math.round(rr*max)}`;
 else if(sc[k-1]){const need=sc[k-1].r+1-s.r,bl=Math.round((max-ov)*6);if(need>0&&bl>0)h+=` • ${t("need")} ${need} ${t("inn")} ${bl} ${t("balls")} • RRR ${(need/(bl/6)).toFixed(2)}`}
 return`<div class="ins">${h}</div>`;
}
const QZ=[
{q:["Who has scored the most international centuries in men's cricket?","पुरुष क्रिकेट में सबसे ज़्यादा अंतरराष्ट्रीय शतक किसके नाम हैं?"],o:["Sachin Tendulkar","Virat Kohli","Ricky Ponting","Kumar Sangakkara"],a:0},
{q:["Who won the first Cricket World Cup in 1975?","1975 का पहला क्रिकेट वर्ल्ड कप किसने जीता?"],o:["Australia","England","West Indies","India"],a:2},
{q:["Who captained India to the 1983 World Cup win?","1983 वर्ल्ड कप में भारत के कप्तान कौन थे?"],o:["Sunil Gavaskar","Kapil Dev","MS Dhoni","Mohinder Amarnath"],a:1},
{q:["In which year did the IPL begin?","IPL की शुरुआत किस साल हुई?"],o:["2006","2007","2008","2009"],a:2},
{q:["Who holds the highest individual score in ODI cricket?","वनडे में सबसे बड़ा व्यक्तिगत स्कोर किसका है?"],o:["Rohit Sharma","Martin Guptill","Chris Gayle","Virender Sehwag"],a:0},
{q:["How long is a cricket pitch?","क्रिकेट की पिच कितनी लंबी होती है?"],o:["20 yards","22 yards","24 yards","25 yards"],a:1},
{q:["Who has taken the most wickets in Test cricket?","टेस्ट क्रिकेट में सबसे ज़्यादा विकेट किसके नाम हैं?"],o:["Shane Warne","Anil Kumble","Muttiah Muralitharan","James Anderson"],a:2},
{q:["Which team won the first T20 World Cup in 2007?","2007 का पहला T20 वर्ल्ड कप किसने जीता?"],o:["Pakistan","India","Australia","Sri Lanka"],a:1},
{q:["Where is the ICC headquarters?","ICC का मुख्यालय कहाँ है?"],o:["London","Mumbai","Dubai","Melbourne"],a:2},
{q:["Who won the first IPL season in 2008?","2008 के पहले IPL सीज़न का विजेता कौन था?"],o:["Chennai Super Kings","Mumbai Indians","Rajasthan Royals","Deccan Chargers"],a:2}];
let Q=null;
function renderQuiz(){
 if(!Q){const st=(Math.floor(Date.now()/864e5)*3)%QZ.length;Q={list:[0,1,2,3,4].map(j=>QZ[(st+j)%QZ.length]),i:0,sc:0,pick:null}}
 const hi=S.lang==="hi"?1:0;
 if(Q.i>=5){
  const msg=encodeURIComponent(`🏏 CricScore India Quiz: ${Q.sc}/5!\n${location.origin}`);
  $("list").innerHTML=`<div class="panel"><div class="row"><div class="ttl">${t("qh")}</div><div class="pr" style="margin-top:8px">${t("fin")}</div><div class="big">${Q.sc}/5</div><div class="vn">${t("come")}</div><a class="btn" target="_blank" rel="noopener" href="https://wa.me/?text=${msg}">${t("shq")}</a><button class="btn" data-rq="1">${t("again")}</button></div></div>`;return}
 const q=Q.list[Q.i];
 $("list").innerHTML=`<div class="panel"><div class="row"><div class="pr">${t("qh")} • ${t("qs")} ${Q.i+1}/5</div><div class="ttl" style="font-size:1.1rem;margin-top:6px">${esc(q.q[hi])}</div>${q.o.map((x,k)=>`<button class="opt ${Q.pick===null?"":k===q.a?"ok":k===Q.pick?"bad":""}" data-o="${k}">${esc(x)}</button>`).join("")}${Q.pick!==null?`<button class="btn" data-nx="1">${t("next")}</button>`:""}</div></div>`;
}
function answer(k){if(Q.pick!==null)return;Q.pick=k;if(k===Q.list[Q.i].a)Q.sc++;renderQuiz()}
const fi=(id,l,v="")=>`<label>${l}<input id="${id}" type="number" inputmode="decimal" min="0" step="any" value="${v}"></label>`;
function renderTools(){
 $("list").innerHTML=`<div class="panel"><div class="row"><div class="ttl">${t("rrr")}</div><div class="fg">${fi("tg",t("tg"))}${fi("rs",t("rs"))}${fi("ot",t("to"),"20")}${fi("ob",t("ob"))}</div><div class="res" id="r1"></div></div>
 <div class="row"><div class="ttl">${t("sr")}</div><div class="fg">${fi("sr1",t("rn"))}${fi("sr2",t("bl"))}</div><div class="res" id="r2"></div></div>
 <div class="row"><div class="ttl">${t("ec")}</div><div class="fg">${fi("ec1",t("rc"))}${fi("ec2",t("ov"))}</div><div class="res" id="r3"></div></div></div>`;
}
function calc(){
 const n=id=>parseFloat($(id).value),ov=x=>Math.floor(x)+Math.round((x%1)*10)/6;
 const a=[n("tg"),n("rs"),n("ot"),n("ob")],left=ov(a[2])-ov(a[3]);
 $("r1").textContent=a.some(isNaN)||left<=0?"":`${t("need")} ${Math.max(a[0]-a[1],0)} ${t("inn")} ${Math.round(left*6)} ${t("balls")} • RRR ${(Math.max(a[0]-a[1],0)/left).toFixed(2)}`;
 const r=n("sr1"),b=n("sr2");$("r2").textContent=isNaN(r)||!(b>0)?"":(r/b*100).toFixed(2);
 const c=n("ec1"),o=n("ec2");$("r3").textContent=isNaN(c)||!(o>0)?"":(c/ov(o)).toFixed(2);
}
function thwack(){try{
 const c=new(window.AudioContext||window.webkitAudioContext)(),sr=c.sampleRate;
 const n=c.createBuffer(1,Math.round(sr*.2),sr),d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);
 const src=c.createBufferSource();src.buffer=n;const bp=c.createBiquadFilter();bp.type="bandpass";bp.frequency.value=1200;src.connect(bp);bp.connect(c.destination);src.start();
}catch(e){}}
function splash(first){
 const sp=$("sp");if(!sp)return;
 const HIT=2580;let played=false;
 const aud=new Audio("/bowled.mp3");aud.preload="auto";
 const play=()=>{if(played)return;played=true;try{aud.currentTime=0}catch(e){}const p=aud.play();if(p&&p.catch)p.catch(thwack)};
 setTimeout(play,HIT);
 const hide=()=>{aud.pause();sp.classList.add("out");setTimeout(()=>sp.remove(),550)};
 sp.onclick=hide;
 const sleep=ms=>new Promise(r=>setTimeout(r,ms));
 Promise.race([Promise.all([sleep(5900),first]),sleep(8000)]).then(hide);
}
async function loadNews(){
 try{const r=await fetch("/api/news");const d=await r.json();S.news=Array.isArray(d)?d:[]}catch(e){S.news=[]}
 render();
}
async function load(){
 try{const r=await fetch("/api/matches");const d=await r.json();if(d.error)throw new Error(d.error);S.matches=d.matches||[];S.at=d.updatedAt||Date.now();S.err=""}
 catch(e){S.err=t("err")}
 render();
}
/* Venue weather: Open-Meteo, no key needed */
const wx={};
const WI=c=>c===0?["☀️","Clear"]:c<=3?["⛅","Partly cloudy"]:c<=48?["🌫️","Fog"]:c<=67?["🌧️","Rain"]:c<=77?["❄️","Snow"]:c<=82?["🌦️","Showers"]:["⛈️","Thunderstorm"];
async function weather(venue){
 const city=(venue||"").split(",").pop().trim();if(!city)return"";
 if(wx[city]!==undefined)return wx[city];
 try{
  const g=await(await fetch("https://geocoding-api.open-meteo.com/v1/search?count=1&name="+encodeURIComponent(city))).json();
  const p=g.results&&g.results[0];if(!p)return wx[city]="";
  const w=await(await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${p.latitude}&longitude=${p.longitude}&current=temperature_2m,weather_code,wind_speed_10m&timezone=auto`)).json();
  const c=w.current,i=WI(c.weather_code);
  return wx[city]=`${i[0]} ${city}: ${Math.round(c.temperature_2m)}°C, ${i[1]}, ${t("wind")} ${Math.round(c.wind_speed_10m)} km/h`;
 }catch(e){return wx[city]=""}
}
/* Player info: Wikipedia, no key needed */
async function player(name){
 $("pt").textContent=name;$("pb").innerHTML='<div class="sk" style="margin:12px 0"></div>';$("pl").showModal();
 try{
  const s=await(await fetch("https://en.wikipedia.org/w/api.php?action=query&list=search&srlimit=1&format=json&origin=*&srsearch="+encodeURIComponent(name+" cricketer"))).json();
  const title=s.query.search[0].title;
  const r=await(await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(title))).json();
  $("pb").innerHTML=`${r.thumbnail?`<img class="ph" src="${esc(r.thumbnail.source)}" alt="">`:""}<p><b>${esc(r.title||title)}</b><br>${esc(r.description||"")}</p><p>${esc((r.extract||"").slice(0,650))}</p><p><a href="${esc(r.content_urls?.desktop?.page||"#")}" target="_blank" rel="noopener">${t("wiki")}</a></p><p class="note">${esc(t("wnote"))}</p>`;
 }catch(e){$("pb").innerHTML=`<p>${esc(t("nop"))}</p>`}
}
const pn=n=>n?`<button class="pn" data-p="${esc(n)}">${esc(n)}</button>`:"";
const tbl=(h,rows)=>`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr>${rows}</table></div>`;
function card(d){
 const inns=d.scorecard||[];if(!inns.length)return`<p>${t("nosc")}</p>`;
 return inns.map(i=>`<h3>${esc(i.inning)}</h3>`+
 tbl([t("bat"),"R","B","4s","6s"],(i.batting||[]).map(b=>`<tr><td>${pn(b.batsman?.name)}<small>${esc(b["dismissal-text"]||"")}</small></td><td>${esc(b.r)}</td><td>${esc(b.b)}</td><td>${esc(b["4s"])}</td><td>${esc(b["6s"])}</td></tr>`).join(""))+
 tbl([t("bowl"),"O","M","R","W"],(i.bowling||[]).map(b=>`<tr><td>${pn(b.bowler?.name)}</td><td>${esc(b.o)}</td><td>${esc(b.m)}</td><td>${esc(b.r)}</td><td>${esc(b.w)}</td></tr>`).join(""))).join("");
}
async function openMatch(id,name,venue){
 $("dt").textContent=name||"";$("wx").textContent="";$("db").innerHTML='<div class="sk" style="margin:12px 0"></div>';
 if(!$("dlg").open)$("dlg").showModal();
 try{history.replaceState(null,"","/match/"+encodeURIComponent(id))}catch(e){}
 if(venue)weather(venue).then(x=>{$("wx").textContent=x});
 try{const r=await fetch("/api/match/"+encodeURIComponent(id));const d=await r.json();if(d.error)throw new Error(d.error);$("db").innerHTML=card(d)}
 catch(err){$("db").innerHTML=`<p>${esc(t("nosc"))}</p>`}
}
document.addEventListener("click",e=>{
 const p=e.target.closest("button[data-p]");if(p){player(p.dataset.p);return}
 const b=e.target.closest("button[data-id]");if(b)openMatch(b.dataset.id,b.dataset.n,b.dataset.v);
});
$("dlg").addEventListener("close",()=>{if(location.pathname.startsWith("/match/"))try{history.replaceState(null,"","/")}catch(e){}});
$("dx").onclick=()=>$("dlg").close();$("px").onclick=()=>$("pl").close();
for(const id of["dlg","pl"])$(id).addEventListener("click",e=>{if(e.target===$(id))$(id).close()});
$("tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(b){S.tab=b.dataset.t;render();if(S.tab==="news"&&S.news===null)loadNews()}});
$("fIn").onclick=()=>{S.india=true;put("india","1");render()};
$("fAll").onclick=()=>{S.india=false;put("india","0");render()};
$("fav").onchange=e=>{S.fav=e.target.value;put("fav",S.fav);render()};
$("lang").onclick=()=>{S.lang=S.lang==="en"?"hi":"en";put("lang",S.lang);render()};
$("theme").onclick=()=>{S.theme=S.theme==="dark"?"light":"dark";put("theme",S.theme);document.documentElement.dataset.theme=S.theme};
document.addEventListener("input",e=>{if(e.target.closest(".fg"))calc()});
document.addEventListener("click",e=>{const o=e.target.closest("[data-o]");if(o){answer(+o.dataset.o);return}if(e.target.closest("[data-nx]")){Q.i++;Q.pick=null;renderQuiz();return}if(e.target.closest("[data-rq]")){Q=null;renderQuiz()}});
const WPS=["stadium","pitch","tricolor","photo","plain"],WPN={en:["Stadium","Pitch","Tricolor","Photo","Plain"],hi:["स्टेडियम","पिच","तिरंगा","फोटो","सादा"]};
let tt;$("wpb").onclick=()=>{S.wp=WPS[(WPS.indexOf(S.wp)+1)%WPS.length];put("wp",S.wp);document.documentElement.dataset.wp=S.wp;$("toast").textContent="▦ "+WPN[S.lang][WPS.indexOf(S.wp)];$("toast").classList.add("on");clearTimeout(tt);tt=setTimeout(()=>$("toast").classList.remove("on"),1600)};
if(!WPS.includes(S.wp))S.wp="stadium";document.documentElement.dataset.wp=S.wp;
document.documentElement.dataset.theme=S.theme;render();const first=load();setInterval(load,120000);splash(first);
if(location.pathname.startsWith("/match/")){const id=decodeURIComponent(location.pathname.split("/")[2]||"");first.then(()=>{const m=S.matches.find(x=>x.id===id);openMatch(id,m?(m.teams||[]).join(" vs "):"",m&&m.venue)})}
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));
let dp;addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e;$("inst").hidden=false});
$("inst").onclick=async()=>{if(!dp)return;dp.prompt();try{await dp.userChoice}catch(e){}dp=null;$("inst").hidden=true};
</script>
